name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main      

permissions:
  contents: read
  id-token: write


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Build Docker image
        run: docker build -t renuja-devops-app:ci .

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: renuja-devops-app:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::486940689963:role/GitHubActionsECRRole
          aws-region: us-east-1

      - name: Verify AWS identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2.1.6

      - name: Tag Docker image for ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker tag renuja-devops-app:ci 486940689963.dkr.ecr.us-east-1.amazonaws.com/renuja-devops-app:${{ github.sha }}

      - name: Push Docker image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push 486940689963.dkr.ecr.us-east-1.amazonaws.com/renuja-devops-app:${{ github.sha }}

      - name: Configure kubectl for EKS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name renuja-devops-eks

      - name: Deploy new image to EKS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          kubectl set image \
            deployment/renuja-devops-app \
            renuja-devops-app=486940689963.dkr.ecr.us-east-1.amazonaws.com/renuja-devops-app:${{ github.sha }} \
            -n renuja-devops

      - name: Verify EKS rollout
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          kubectl rollout status \
            deployment/renuja-devops-app \
            -n renuja-devops \
            --timeout=180s
