apiVersion: apps/v1
kind: Deployment

metadata:
  name: renuja-devops-app
  namespace: renuja-devops

spec:
  replicas: 2

  selector:
    matchLabels:
      app: renuja-devops-app

  template:
    metadata:
      labels:
        app: renuja-devops-app

    spec:
      containers:
        - name: renuja-devops-app
          image: renuja-devops-app:ci
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: renuja-devops-config
            - secretRef:
                name: renuja-devops-secret    
          ports:
            - containerPort: 5000

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
